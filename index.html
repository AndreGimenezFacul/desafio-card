<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Lexend+Deca&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Stats preview card</title>
</head>
<body>
  <main class="card">
    <div class="card-content">
      <h1>Get <span>insights</span> that help your business grow.</h1>
      <p class="description">Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>
      <ul class="stats" aria-label="Business statistics">
        <li><strong>10k+</strong><span>companies</span></li>
        <li><strong>314</strong><span>templates</span></li>
        <li><strong>12M+</strong><span>queries</span></li>
      </ul>
    </div>
    <picture class="card-image">
      <source media="(max-width: 700px)" srcset="images/image-header-mobile.jpg">
      <img src="images/image-header-desktop.jpg" alt="People working together in an office">
    </picture>
  </main>
</body>
</html>
